[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-stackviz"
version = "2.0.0"
description = "A multi-source anime intelligence platform: ingestion, warehouse, prediction, and a serving API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "duckdb>=1.0,<2",
  "pyarrow>=15,<21",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]
# matplotlib only powers the legacy Stack Exchange report; kept out of core so the
# serving image stays slim.
reports = ["matplotlib>=3.8,<4"]
dev = [
  "pytest>=8,<9", "ruff>=0.9,<1", "responses>=0.25,<1", "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
]

[project.scripts]
anime-stackviz = "anime_stackviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
